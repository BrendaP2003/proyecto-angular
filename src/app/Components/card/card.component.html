<article class="restaurant-card" [class.invertida]="invertida()">

  <img
    [src]="restaurante().imagen"
    [alt]="restaurante().nombre"
  >
  <div class="restaurant-info">
     <h2>{{ restaurante().nombre }}</h2>

    <p>{{ restaurante().tipo }}</p>

    <p>📍 {{ restaurante().ciudad }}</p>

    
  </div>

</article>
