<section class="franquicias">

<app-promo-card-component
  titulo="PROMOSION SUSHIS"
  imagen='/access/Group1.svg' 
  texto="Únete a nuestra historia de crecimiento. Conoce nuestros distintos modelos de franquicia, contáctanos y descubre el proyecto de inversión ideal para ti."
  textoBoton="Conoce nuestras franquicias">
</app-promo-card-component>

</section>

<section class="results">
  @for (restaurante of restaurantes; track restaurante.nombre; let i = $index) {

  <app-card
  
    [restaurante] = "restaurante"
    [invertida]="i % 2 === 1">
  </app-card>

}

</section>
